org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
org.gradle.native=false
android.useAndroidX=true

# AGP 9 / Flutter 3.47: Kotlin embutido no AGP (padrão Google). newDsl=false permanece
# enquanto plugins oficiais ainda usam o DSL antigo — o migrador do Flutter exige isso.
android.newDsl=false
android.builtInKotlin=true

# Projeto no D:, pub-cache no C:. O Kotlin incremental não cruza letras de disco.
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.compiler.execution.strategy=in-process
