<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Pulso">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070D"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="55%" stop-color="#3EC4FF"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="960" height="280" fill="url(#bg)"/>
  <path d="M40 188 C120 188, 140 92, 220 92 S320 188, 400 188 S480 70, 560 70 S640 210, 740 210 S820 120, 920 120"
        fill="none" stroke="url(#neon)" stroke-width="3.5" opacity="0.95" filter="url(#glow)"/>
  <circle cx="220" cy="92" r="5" fill="#00F0FF"/>
  <circle cx="560" cy="70" r="5" fill="#FF2BD6"/>
  <text x="480" y="150" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="72" font-weight="700" letter-spacing="14" fill="#E8EDF7">PULSO</text>
  <text x="480" y="188" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="16" letter-spacing="6" fill="#8B95AD">O PULSO DA SUA MÁQUINA</text>
</svg>
